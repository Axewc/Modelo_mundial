name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-y-tests:
    name: Lint + tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Ruff (errores de sintaxis y pyflakes)
        run: ruff check .
      - name: Tests unitarios
        run: pytest -m "not slow" -q

  app-smoke:
    name: Smoke de la app (entrena el pipeline completo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: AppTest (app principal + editor)
        run: pytest -m slow -q
